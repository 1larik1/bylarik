name: Android

# Сборка → проверка на эмуляторе → выпуск → проверка обновления.
# Новая версия попадает на телефоны, только если прошла проверку на эмуляторе.

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    outputs:
      version: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Сборочный ключ подписи создаётся один раз и хранится в кеше Actions,
      # чтобы обновления ставились поверх (кеш живёт, пока сборки идут хотя бы раз в неделю).
      - name: Signing key cache
        uses: actions/cache@v4
        with:
          path: ~/otboi-ci-key
          key: otboi-ci-key-v1

      - name: Unit tests
        run: gradle --no-daemon testReleaseUnitTest --tests 'ua.otboi.app.LogicTest' --stacktrace

      - name: Live check of alert, weather and Telegram sources
        continue-on-error: true
        run: gradle --no-daemon testReleaseUnitTest --tests 'ua.otboi.app.LiveApiTest' 2>&1 | grep -E "LIVE|FAIL|BUILD" || true

      - name: Signing key
        env:
          KS_B64: ${{ secrets.OTBOI_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.OTBOI_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/otboi.jks"
            echo "OTBOI_KEYSTORE=$RUNNER_TEMP/otboi.jks" >> "$GITHUB_ENV"
            echo "OTBOI_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          else
            KS="$HOME/otboi-ci-key/otboi-ci.jks"
            if [ ! -f "$KS" ]; then
              mkdir -p "$(dirname "$KS")"
              keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias otboi \
                -keyalg RSA -keysize 2048 -validity 36500 \
                -storepass android -keypass android -dname "CN=Otboi CI, O=Otboi, C=UA"
              echo "::warning::New signing key created: this build can't update older installs"
            fi
            echo "OTBOI_KEYSTORE=$KS" >> "$GITHUB_ENV"
            echo "OTBOI_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk bylarik.apk

      - name: Check APK (signature, app class)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs bylarik.apk | tee certs.txt
          grep -q "CN=Otboi" certs.txt
          "$BT/aapt2" dump xmltree bylarik.apk --file AndroidManifest.xml | grep -A15 "E: application" | grep -q "OtboiApp"
          unzip -o -q bylarik.apk 'classes*.dex' -d dex
          grep -l -a "Lua/otboi/app/OtboiApp;" dex/*.dex

      - id: ver
        name: Version
        run: |
          echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/bylarik.apk

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build.log

  emulator:
    name: Emulator check (Android 14)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, walk through screens, test alarm
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 android/ci/smoke.py check apk/bylarik.apk screens

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screens
          path: screens

      - name: Screenshots to a draft release (private)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d screens ] || exit 0
          (cd screens && zip -q -r ../emulator-screens.zip .)
          gh release delete android-test --yes --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release delete ci-screens --yes -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create ci-screens emulator-screens.zip --draft -R "$GITHUB_REPOSITORY" \
            --title "CI screenshots" --notes "Emulator screenshots for ${GITHUB_SHA::7}. Draft, not public."

  release:
    name: Release
    needs: [build, emulator]
    # Выпускаем только из main; ветки — для проверки без выпуска.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.publish.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
      VN: ${{ needs.build.outputs.version }}
      VC: ${{ needs.build.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Keep the previous version (for the update test)
        run: |
          mkdir -p prev
          if gh release view "v$VN" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VN already released"
          elif gh release download -R "$GITHUB_REPOSITORY" -p bylarik.apk -D prev 2>/dev/null; then
            echo "previous: latest release"
          elif gh release download android-latest -R "$GITHUB_REPOSITORY" -p Otboi.apk -D prev 2>/dev/null; then
            mv prev/Otboi.apk prev/bylarik.apk
            echo "previous: legacy android-latest"
          fi
          ls -la prev

      - uses: actions/upload-artifact@v4
        with:
          name: previous-apk
          path: prev/bylarik.apk
          if-no-files-found: ignore

      - id: publish
        name: Publish v${{ needs.build.outputs.version }}
        run: |
          if gh release view "v$VN" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VN already exists, nothing to publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp apk/bylarik.apk bylarik.apk
          SHA=$(sha256sum bylarik.apk | cut -d' ' -f1)
          NOTES=android/release-notes.json
          jq -n --argjson vc "$VC" --arg vn "$VN" --arg sha "$SHA" --slurpfile n "$NOTES" \
            '{versionCode: $vc, versionName: $vn, sha256: $sha, notes: ($n[0] | {uk, ru, en})}' > version.json
          cat version.json
          {
            echo "$(jq -r .en "$NOTES")"
            echo
            echo "**Install:** download \`bylarik.apk\` on your phone and open it. If bylarik is already installed, it will offer this update by itself."
            echo
            echo "SHA-256: \`$SHA\`"
          } > body.md
          gh release create "v$VN" bylarik.apk version.json -R "$GITHUB_REPOSITORY" \
            --title "bylarik $VN" --notes-file body.md --target "$GITHUB_SHA" --latest

          # Канал обновлений для версий 1.2 и старше (они смотрят android-latest/Otboi.apk).
          mkdir -p legacy && cp bylarik.apk legacy/Otboi.apk
          jq -n --argjson vc "$VC" --arg vn "$VN" --arg sha "$SHA" --arg notes "$(jq -r .ru "$NOTES")" \
            '{versionCode: $vc, versionName: $vn, sha256: $sha, notes: $notes}' > legacy/version.json
          gh release delete android-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create android-latest legacy/Otboi.apk legacy/version.json -R "$GITHUB_REPOSITORY" \
            --title "Update channel for bylarik 1.2 and older" --prerelease --latest=false --target "$GITHUB_SHA" \
            --notes "Technical release: lets versions 1.2 and older update themselves. Download the app from the latest release instead."
          echo "published=true" >> "$GITHUB_OUTPUT"

  update-test:
    name: Update test (previous → new)
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: previous-apk
          path: prev

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the previous version and update from inside the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 android/ci/smoke.py update prev/bylarik.apk screens-update

      - name: Screenshots to a draft release (private)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d screens-update ] || exit 0
          (cd screens-update && zip -q -r ../update-screens.zip .)
          gh release delete ci-update-screens --yes -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create ci-update-screens update-screens.zip --draft -R "$GITHUB_REPOSITORY" \
            --title "CI update screenshots" --notes "Update test screenshots for ${GITHUB_SHA::7}. Draft, not public."
